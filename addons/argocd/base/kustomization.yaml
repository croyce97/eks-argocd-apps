apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - repository-eks-argocd-apps.yaml
helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    releaseName: argocd
    namespace: argocd
    valuesInline:
      configs:
        cm:
          kustomize.buildOptions: --enable-helm
      server:
        extraArgs:
          - --insecure
        service:
          type: LoadBalancer
