apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
helmCharts:
  - name: ingress-nginx
    repo: https://kubernetes.github.io/ingress-nginx
    releaseName: ingress-nginx
    namespace: ingress-nginx
    valuesInline:
      controller:
        service:
          type: LoadBalancer
        config:
          use-forwarded-headers: "true"
          compute-full-forwarded-for: "true"

