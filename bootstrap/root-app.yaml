apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eks-argocd-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/croyce97/eks-argocd-apps
    targetRevision: HEAD
    path: clusters/eks-argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
