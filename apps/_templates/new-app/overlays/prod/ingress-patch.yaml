apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: new-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - new-app.yourdomain.com
      secretName: new-app-tls
  rules:
    - host: new-app.yourdomain.com
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: new-app
                port:
                  number: 80

